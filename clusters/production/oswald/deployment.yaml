apiVersion: apps/v1
kind: Deployment
metadata:
  name: oswald
  labels:
    app: oswald
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oswald
  template:
    metadata:
      labels:
        app: oswald
    spec:
      # Block API token and kernel syscalls
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: "Always"
        seccompProfile:
          type: RuntimeDefault

      # initContainers:
      #   # TMP FIX FOR `read user soul: unsafe soul file`
      #   - name: secure-perms
      #     image: ghcr.io/jonahgcarpenter/oswald-ai/oswald-ai:v5.1.0-beta.3
      #     securityContext:
      #       runAsUser: 0
      #     command:
      #       [
      #         "sh",
      #         "-c",
      #         "chown -R 999:999 /home/oswald/.oswald && find /home/oswald/.oswald -type d -exec chmod 700 {} + && find /home/oswald/.oswald -type f -exec chmod 600 {} +",
      #       ]
      #     volumeMounts:
      #       - { name: oswald, mountPath: /home/oswald/.oswald }

      containers:
        - name: oswald-ai
          image: ghcr.io/jonahgcarpenter/oswald-ai/oswald-ai:v5.1.0-beta.4
          env:
            # # TMP FIX for browser crashes
            # - name: HOME
            #   value: /tmp
            # - name: TMPDIR
            #   value: /tmp
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gh-token
                  key: GH_TOKEN

          # Enforcing Principle of Least Privilege
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL

          # Mounting the storage directory
          volumeMounts:
            - name: oswald
              mountPath: /home/oswald/.oswald
            # # TMP FIX for browser crashes
            # - name: tmp-dir
            #   mountPath: /tmp

      volumes:
        - name: oswald
          persistentVolumeClaim:
            claimName: oswald-pvc
        # # TMP FIX for browser crashes
        # - name: tmp-dir
        #   emptyDir:
        #     sizeLimit: 256Mi
