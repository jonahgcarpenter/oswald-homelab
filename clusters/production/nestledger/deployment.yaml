apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestledger
  labels:
    app: nestledger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nestledger
  template:
    metadata:
      labels:
        app: nestledger
    spec:
      initContainers:
        - name: initialize-storage
          image: ghcr.io/jonahgcarpenter/nestledger:v1.0.2
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /app/data/statements
              chown -R appuser:appuser /app/data
              chmod 700 /app/data /app/data/statements
          volumeMounts:
            - name: storage-volume
              mountPath: /app/data

      containers:
        - name: nestledger
          image: ghcr.io/jonahgcarpenter/nestledger:v1.0.2

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          volumeMounts:
            - name: storage-volume
              mountPath: /app/data

      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: nestledger-pvc
