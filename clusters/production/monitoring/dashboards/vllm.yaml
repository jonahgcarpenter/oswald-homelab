                                      {
                                        "query":
                                          {
                                            "kind": "DataQuery",
                                            "group": "prometheus",
                                            "version": "v0",
                                            "datasource": { "name": "prometheus" },
                                            "spec":
                                              {
                                                "expr": 'rate(vllm:request_decode_time_seconds_sum{model_name="$model_name"}[5m]) / clamp_min(rate(vllm:request_decode_time_seconds_count{model_name="$model_name"}[5m]), 0.001)',
