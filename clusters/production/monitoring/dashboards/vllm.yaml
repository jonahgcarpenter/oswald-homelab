            "spec": {
              "id": 202,
              "title": "Inference Stage Breakdown",
              "description": "Prefill (input processing) versus decode (output generation) latency. High prefill latency points to long input prompts; high decode latency points to long generated outputs.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "prometheus"
                          },
                          "spec": {
                            "expr": "rate(vllm:request_prefill_time_seconds_sum{model_name=\"$model_name\"}[5m]) / clamp_min(rate(vllm:request_prefill_time_seconds_count{model_name=\"$model_name\"}[5m]), 0.001)",
