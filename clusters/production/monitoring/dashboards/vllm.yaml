            {
              "panel-101":
                {
                  "kind": "Panel",
                  "spec":
                    {
                      "id": 101,
                      "title": "Success Rate",
                      "description": "요청 성공률. 99.5% 이상이면 정상(초록), 98% 미만이면 위험(빨강). finished_reason='stop'인 정상 완료만 성공으로 집계.",
                      "links": [],
                      "data":
                        {
                          "kind": "QueryGroup",
                          "spec":
                            {
                              "queries":
                                [
                                  {
                                    "kind": "PanelQuery",
                                    "spec":
                                      {
                                        "query":
                                          {
                                            "kind": "DataQuery",
                                            "group": "prometheus",
                                            "version": "v0",
                                            "datasource": { "name": "prometheus" },
                                            "spec":
                                              {
                                                "expr": '(sum(rate(vllm:request_success_total{finished_reason=~"stop|length", model_name="$model_name"}[5m])) / clamp_min(sum(rate(vllm:request_success_total{model_name="$model_name"}[5m])), 0.001)) * 100',
                                                "legendFormat": "Success Rate",
                                              },
                                          },
                                        "refId": "A",
                                        "hidden": false,
                                      },
                                  },
                                ],
                              "transformations": [],
                              "queryOptions": {},
                            },
                        },
                      "vizConfig":
                        {
                          "kind": "VizConfig",
                          "group": "stat",
                          "version": "12.3.0",
                          "spec":
                            {
                              "options":
                                {
                                  "colorMode": "value",
                                  "graphMode": "area",
                                  "justifyMode": "auto",
                                  "orientation": "auto",
                                  "reduceOptions":
                                    {
                                      "calcs": ["lastNotNull"],
                                      "fields": "",
                                      "values": false,
                                    },
                                  "showPercentChange": false,
                                  "textMode": "auto",
                                  "wideLayout": true,
                                },
                              "fieldConfig":
                                {
                                  "defaults":
                                    {
                                      "unit": "percent",
                                      "min": 0,
                                      "max": 100,
                                      "thresholds":
                                        {
                                          "mode": "absolute",
                                          "steps":
                                            [
                                              { "value": null, "color": "red" },
                                              { "value": 98, "color": "yellow" },
                                              { "value": 99.5, "color": "green" },
                                            ],
                                        },
                                      "color": { "mode": "thresholds" },
                                    },
                                  "overrides": [],
                                },
                            },
                        },
                    },
                },
              "panel-102":
                {
                  "kind": "Panel",
                  "spec":
                    {
                      "id": 102,
                      "title": "Active Requests",
                      "description": "현재 처리 중(Running) + 대기 중(Waiting) 요청 수. 급격히 증가하면 트래픽 급증 신호.",
                      "links": [],
                      "data":
                        {
                          "kind": "QueryGroup",
                          "spec":
                            {
                              "queries":
                                [
                                  {
                                    "kind": "PanelQuery",
                                    "spec":
                                      {
                                        "query":
                                          {
                                            "kind": "DataQuery",
                                            "group": "prometheus",
                                            "version": "v0",
                                            "datasource": { "name": "prometheus" },
                                            "spec":
                                              {
                                                "expr": 'sum(vllm:num_requests_running{model_name="$model_name"}) + sum(vllm:num_requests_waiting{model_name="$model_name"})',
                                                "legendFormat": "Active",
                                              },
                                          },
                                        "refId": "A",
                                        "hidden": false,
                                      },
                                  },
                                ],
                              "transformations": [],
                              "queryOptions": {},
                            },
                        },
                      "vizConfig":
                        {
                          "kind": "VizConfig",
                          "group": "gauge",
                          "version": "12.3.0",
                          "spec":
                            {
                              "options":
                                {
                                  "minVizHeight": 75,
                                  "minVizWidth": 75,
                                  "orientation": "auto",
                                  "reduceOptions":
                                    {
                                      "calcs": ["lastNotNull"],
                                      "fields": "",
                                      "values": false,
                                    },
                                  "showThresholdLabels": false,
                                  "showThresholdMarkers": true,
                                  "sizing": "auto",
                                },
                              "fieldConfig":
                                {
                                  "defaults":
                                    {
                                      "unit": "short",
                                      "min": 0,
                                      "max": 100,
                                      "thresholds":
                                        {
                                          "mode": "absolute",
                                          "steps":
                                            [
                                              { "value": null, "color": "green" },
                                              { "value": 30, "color": "yellow" },
                                              { "value": 60, "color": "red" },
                                            ],
                                        },
                                      "color": { "mode": "thresholds" },
                                    },
                                  "overrides": [],
                                },
                            },
                        },
                    },
                },
              "panel-103":
                {
                  "kind": "Panel",
                  "spec":
                    {
                      "id": 103,
                      "title": "System Efficiency",
                      "description": "스케줄러 효율성. Running/(Running+Waiting). 100%면 모든 요청이 즉시 처리됨. 70% 미만이면 과부하.",
                      "links": [],
                      "data":
                        {
                          "kind": "QueryGroup",
                          "spec":
                            {
                              "queries":
                                [
                                  {
                                    "kind": "PanelQuery",
                                    "spec":
                                      {
                                        "query":
                                          {
                                            "kind": "DataQuery",
                                            "group": "prometheus",
                                            "version": "v0",
                                            "datasource": { "name": "prometheus" },
                                            "spec":
                                              {
                                                "expr": 'clamp_max((sum(vllm:num_requests_running{model_name="$model_name"}) + 0.001) / (sum(vllm:num_requests_running{model_name="$model_name"}) + sum(vllm:num_requests_waiting{model_name="$model_name"}) + 0.001), 1)',
                                                "legendFormat": "Efficiency",
                                              },
                                          },
                                        "refId": "A",
                                        "hidden": false,
                                      },
                                  },
                                ],
                              "transformations": [],
                              "queryOptions": {},
                            },
                        },
                      "vizConfig":
                        {
                          "kind": "VizConfig",
                          "group": "stat",
                          "version": "12.3.0",
                          "spec":
                            {
                              "options":
                                {
                                  "colorMode": "value",
                                  "graphMode": "area",
                                  "justifyMode": "auto",
                                  "orientation": "auto",
                                  "reduceOptions":
                                    {
                                      "calcs": ["lastNotNull"],
                                      "fields": "",
                                      "values": false,
                                    },
                                  "showPercentChange": false,
                                  "textMode": "auto",
                                  "wideLayout": true,
                                },
                              "fieldConfig":
                                {
                                  "defaults":
                                    {
                                      "unit": "percentunit",
                                      "min": 0,
                                      "max": 1,
                                      "thresholds":
                                        {
                                          "mode": "absolute",
                                          "steps":
                                            [
                                              { "value": null, "color": "red" },
                                              { "value": 0.7, "color": "yellow" },
                                              { "value": 0.9, "color": "green" },
                                            ],
                                        },
                                      "color": { "mode": "thresholds" },
                                    },
                                  "overrides": [],
                                },
                            },
                        },
                    },
                },
              "panel-104":
                {
                  "kind": "Panel",
                  "spec":
                    {
                      "id": 104,
                      "title": "TTFT P99",
                      "description": "첫 토큰 생성까지 걸리는 시간 P99. 사용자가 느끼는 초기 응답 속도의 핵심 지표. 1초 미만이 이상적.",
                      "links": [],
                      "data":
                        {
                          "kind": "QueryGroup",
                          "spec":
                            {
                              "queries":
                                [
                                  {
                                    "kind": "PanelQuery",
                                    "spec":
                                      {
                                        "query":
                                          {
                                            "kind": "DataQuery",
                                            "group": "prometheus",
                                            "version": "v0",
                                            "datasource": { "name": "prometheus" },
                                            "spec":
                                              {
                                                "expr": 'histogram_quantile(0.99, sum(rate(vllm:time_to_first_token_seconds_bucket{model_name="$model_name"}[5m])) by (le))',
                                                "legendFormat": "TTFT P99",
                                              },
                                          },
                                        "refId": "A",
                                        "hidden": false,
                                      },
                                  },
                                ],
                              "transformations": [],
                              "queryOptions": {},
                            },
                        },
                      "vizConfig":
                        {
                          "kind": "VizConfig",
                          "group": "stat",
                          "version": "12.3.0",
                          "spec":
                            {
                              "options":
                                {
                                  "colorMode": "value",
                                  "graphMode": "area",
                                  "justifyMode": "auto",
                                  "orientation": "auto",
                                  "reduceOptions":
                                    {
                                      "calcs": ["lastNotNull"],
                                      "fields": "",
                                      "values": false,
                                    },
                                  "showPercentChange": false,
                                  "textMode": "auto",
                                  "wideLayout": true,
                                },
                              "fieldConfig":
                                {
                                  "defaults":
                                    {
                                      "unit": "s",
                                      "thresholds":
                                        {
                                          "mode": "absolute",
                                          "steps":
                                            [
                                              { "value": null, "color": "green" },
                                              { "value": 1, "color": "yellow" },
                                              { "value": 3, "color": "red" },
                                            ],
                                        },
                                      "color": { "mode": "thresholds" },
                                    },
                                  "overrides": [],
                                },
                            },
                        },
                    },
                },
              "panel-105":
                {
                  "kind": "Panel",
                  "spec":
                    {
                      "id": 105,
                      "title": "Preemption Rate",
                      "description": "[Critical] Preemption 발생률. KV Cache 부족으로 실행 중인 요청을 중단. 0 초과 시 즉시 확인 필요. GPU 메모리 증설 또는 배치 크기 감소 고려.",
                      "links": [],
                      "data":
                        {
                          "kind": "QueryGroup",
                          "spec":
                            {
                              "queries":
                                [
                                  {
                                    "kind": "PanelQuery",
                                    "spec":
                                      {
                                        "query":
                                          {
                                            "kind": "DataQuery",
                                            "group": "prometheus",
                                            "version": "v0",
                                            "datasource": { "name": "prometheus" },
                                            "spec":
                                              {
                                                "expr": 'sum(rate(vllm:num_preemptions_total{model_name="$model_name"}[5m]))',
                                                "legendFormat": "Preemption/s",
                                              },
                                          },
                                        "refId": "A",
                                        "hidden": false,
                                      },
                                  },
                                ],
                              "transformations": [],
                              "queryOptions": {},
                            },
                        },
                      "vizConfig":
                        {
                          "kind": "VizConfig",
                          "group": "stat",
                          "version": "12.3.0",
                          "spec":
                            {
                              "options":
                                {
                                  "colorMode": "value",
                                  "graphMode": "area",
                                  "justifyMode": "auto",
                                  "orientation": "auto",
