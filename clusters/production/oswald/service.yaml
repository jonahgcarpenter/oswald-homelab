apiVersion: v1
kind: Service
metadata:
  name: oswald-svc
  namespace: oswald
  labels:
    app: oswald
spec:
  type: LoadBalancer
  loadBalancerIP: "192.168.4.235"
  selector:
    app: oswald
  ports:
    - name: bluebubbles
      protocol: TCP
      port: 8090
      targetPort: 8090
    - name: api
      protocol: TCP
      port: 8080
      targetPort: 8080
