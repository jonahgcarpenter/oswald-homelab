          "panel-101": {
            "kind": "Panel",
            "spec": {
              "id": 101,
              "title": "Success Rate",
              "description": "Request success rate. Green at 99.5% or above; red below 98%. Requests with finished_reason='stop' or 'length' count as successful.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "prometheus"
                          },
                          "spec": {
                            "expr": "(sum(rate(vllm:request_success_total{finished_reason=~\"stop|length\", model_name=\"$model_name\"}[5m])) / clamp_min(sum(rate(vllm:request_success_total{model_name=\"$model_name\"}[5m])), 0.001)) * 100",
                            "legendFormat": "Success Rate"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
              "vizConfig": {
                "kind": "VizConfig",
                "group": "stat",
                "version": "12.3.0",
                "spec": {
                  "options": {
                    "colorMode": "value",
                    "graphMode": "area",
                    "justifyMode": "auto",
                    "orientation": "auto",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "showPercentChange": false,
                    "textMode": "auto",
                    "wideLayout": true
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percent",
                      "min": 0,
                      "max": 100,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "value": null,
                            "color": "red"
                          },
                          {
                            "value": 98,
                            "color": "yellow"
                          },
                          {
                            "value": 99.5,
                            "color": "green"
                          }
                        ]
                      },
                      "color": {
                        "mode": "thresholds"
                      }
                    },
                    "overrides": []
                  }
                }
              }
            }
          },
          "panel-102": {
            "kind": "Panel",
            "spec": {
              "id": 102,
              "title": "Active Requests",
              "description": "Number of requests currently running or waiting. A sharp increase may indicate a traffic spike.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "prometheus"
                          },
                          "spec": {
                            "expr": "sum(vllm:num_requests_running{model_name=\"$model_name\"}) + sum(vllm:num_requests_waiting{model_name=\"$model_name\"})",
                            "legendFormat": "Active"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
                  ],
                  "transformations": [],
                  "queryOptions": {}
                }
              },
