              "panel-203":
                {
                  "kind": "Panel",
                  "spec":
                    {
                      "id": 203,
                      "title": "TTFT vs TPOT",
                      "description": "TTFT(첫 토큰까지) vs TPOT(토큰당 생성시간) 비교. TTFT가 높으면 Prefill 병목, TPOT이 높으면 Decode 병목.",
                      "links": [],
                      "data":
                        {
                          "kind": "QueryGroup",
                          "spec":
                            {
                              "queries":
                                [
                                  {
                                    "kind": "PanelQuery",
                                    "spec":
                                      {
