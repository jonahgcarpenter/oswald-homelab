apiVersion: apps/v1
kind: Deployment
metadata:
  name: oswald
  labels:
    app: oswald
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: oswald
  template:
    metadata:
      labels:
        app: oswald
    spec:
      # Block API token and kernel syscalls
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: oswald-ai
          image: ghcr.io/jonahgcarpenter/oswald-ai/oswald-ai:v5.1.0-beta.11
          env:
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gh-token
                  key: GH_TOKEN

          # Enforcing Principle of Least Privilege
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            capabilities:
              drop:
                - ALL

          # Mounting the storage directory
          volumeMounts:
            - name: oswald
              mountPath: /home/oswald/.oswald

      volumes:
        - name: oswald
          persistentVolumeClaim:
            claimName: oswald-pvc
