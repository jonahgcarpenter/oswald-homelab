apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  interval: 15m
  chart:
    spec:
      chart: bifrost
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: bifrost
      version: "2.1.50"
  values:
    image:
      tag: "v2.6.0"

    bifrost:
      setupToken: "env.BIFROST_SETUP_TOKEN"
      encryptionKeySecret:
        name: "bifrost-encryption-key"
        key: "encryption-key"

    storage:
      mode: sqlite
      persistence:
        enabled: true
        size: 15Gi
        storageClass: "longhorn"
      configStore:
        enabled: true
      logsStore:
        enabled: true

    postgresql:
      enabled: false

    vectorStore:
      enabled: false
      type: none

    env:
      - name: BIFROST_SETUP_TOKEN
        valueFrom:
          secretKeyRef:
            name: bifrost-setup-token
            key: setup-token
