          "panel-104": {
            "kind": "Panel",
            "spec": {
              "id": 104,
              "title": "TTFT P99",
              "description": "P99 time to first token, a key measure of perceived initial response speed. Ideally below one second.",
              "links": [],
              "data": {
                "kind": "QueryGroup",
                "spec": {
                  "queries": [
                    {
                      "kind": "PanelQuery",
                      "spec": {
                        "query": {
                          "kind": "DataQuery",
                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "prometheus"
                          },
                          "spec": {
                            "expr": "histogram_quantile(0.99, sum(rate(vllm:time_to_first_token_seconds_bucket{model_name=\"$model_name\"}[5m])) by (le))",
                            "legendFormat": "TTFT P99"
                          }
                        },
                        "refId": "A",
                        "hidden": false
                      }
                    }
