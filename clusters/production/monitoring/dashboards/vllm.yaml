                      "id": 202,
                      "title": "Inference Stage Breakdown",
                      "description": "Prefill(입력 처리) vs Decode(출력 생성) 지연 시간 비중. Prefill이 높으면 긴 입력 프롬프트, Decode가 높으면 긴 출력 생성이 병목.",
                      "links": [],
                      "data":
                        {
                          "kind": "QueryGroup",
                          "spec":
                            {
                              "queries":
                                [
                                  {
                                    "kind": "PanelQuery",
                                    "spec":
                                      {
                                        "query":
                                          {
                                            "kind": "DataQuery",
                                            "group": "prometheus",
                                            "version": "v0",
                                            "datasource": { "name": "prometheus" },
